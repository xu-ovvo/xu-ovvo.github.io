<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="xu-ovvo 的个人主页 - Modern Personal Homepage" />
  <title>xu-ovvo · 个人主页</title>
  <style>
    :root {
      --bg-0: #060714;
      --bg-1: #0b0f2a;
      --bg-2: #141b4d;
      --accent: #6366f1;
      --accent-2: #22d3ee;
      --pink: #f472b6;
      --text: #e8ecf8;
      --muted: #98a2c3;
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.14);
      --radius: 24px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      background: linear-gradient(135deg, var(--bg-0), var(--bg-1) 40%, var(--bg-2) 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* ---- animated background ---- */
    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      animation: orb-float 18s ease-in-out infinite alternate;
      will-change: transform;
    }
    .orb-1 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.75), transparent 70%);
      top: -120px; left: -100px;
    }
    .orb-2 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.55), transparent 70%);
      bottom: -110px; right: -90px;
      animation-delay: -6s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.4), transparent 70%);
      top: 45%; left: 55%;
      animation-delay: -11s;
      animation-duration: 24s;
    }
    @keyframes orb-float {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to   { transform: translate3d(60px, -45px, 0) scale(1.15); }
    }
    canvas#particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.9), transparent 78%);
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.9), transparent 78%);
    }

    /* ---- glass card ---- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 56px 48px 44px;
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: -80px;
      left: -80px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(255,255,255,0.16), transparent 70%);
      pointer-events: none;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow:
        0 34px 100px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    /* avatar ring */
    .avatar-wrap {
      position: relative;
      width: 128px;
      height: 128px;
      margin: 0 auto 26px;
    }
    .avatar-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--pink), var(--accent));
      animation: spin 6s linear infinite;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      filter: blur(0.4px);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #312e81, var(--accent) 55%, var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      box-shadow: 0 12px 34px rgba(99, 102, 241, 0.45);
      user-select: none;
      position: relative;
    }

    .name {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.6px;
      background: linear-gradient(92deg, #c7d2fe 0%, var(--accent-2) 55%, var(--pink) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .handle {
      margin-top: 8px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 400;
    }
    .tagline {
      margin-top: 18px;
      font-size: 16px;
      line-height: 1.8;
      color: #b9c2de;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }

    .chips {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chip {
      font-size: 12.5px;
      padding: 6px 15px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #cbd5f5;
      letter-spacing: 0.3px;
      backdrop-filter: blur(4px);
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .chip:hover {
      border-color: rgba(99, 102, 241, 0.7);
      color: #fff;
      transform: translateY(-2px);
    }

    .actions {
      margin-top: 58px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 30px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
      box-shadow: 0 16px 40px rgba(99, 102, 241, 0.5);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .btn-ghost:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .btn .ic { font-size: 17px; line-height: 1; }

    .status {
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.28);
    }
    .status .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 10px #34d399;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.8); }
    }

    footer {
      margin-top: 34px;
      font-size: 12.5px;
      color: rgba(152, 162, 195, 0.65);
      letter-spacing: 0.4px;
    }

    /* ---- mouse-follow bubbles ---- */
    .bubble {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.85;
      z-index: 9998;
      animation: bubble-rise 1.1s ease-out forwards;
      will-change: transform, opacity;
    }
    @keyframes bubble-rise {
      0%   { transform: translate(0, 0) scale(1); opacity: 0.9; }
      100% { transform: translate(var(--dx, 0px), -52px) scale(0.15); opacity: 0; }
    }

    /* ---- responsive ---- */
    @media (max-width: 520px) {
      body { padding: 18px 12px; }
      .card { padding: 40px 22px 34px; border-radius: 20px; }
      .name { font-size: 27px; }
      .avatar-wrap { width: 104px; height: 104px; }
      .avatar { font-size: 38px; }
      .actions { margin-top: 48px; gap: 12px; }
      .btn { padding: 12px 22px; font-size: 14px; }
      .orb-1 { width: 280px; height: 280px; }
      .orb-2 { width: 260px; height: 260px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bubble, .avatar-ring, .orb, canvas#particles { animation: none !important; }
      .bubble { display: none; }
    }
  </style>
</head>
<body>
  <!-- animated background -->
  <div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="bg-grid"></div>
    <canvas id="particles"></canvas>
  </div>

  <main class="card">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar">xu</div>
    </div>

    <h1 class="name">xu-ovvo</h1>
    <p class="handle">@xu-ovvo · GitHub Pages</p>
    <p class="tagline">你好，我是 xu-ovvo。一名热爱代码与创造的开发者，正在 GitHub Pages 上构建属于自己的数字角落。</p>

    <div class="chips">
      <span class="chip">Developer</span>
      <span class="chip">Frontend</span>
      <span class="chip">GitHub Pages</span>
      <span class="chip">Open Source</span>
    </div>

    <nav class="actions">
      <a class="btn btn-ghost" href="https://github.com/xu-ovvo" target="_blank" rel="noopener">
        <span class="ic">&#128279;</span> GitHub
      </a>
      <a class="btn btn-primary" href="mailto:3838943412@qq.com">
        <span class="ic">&#9993;</span> 联系我
      </a>
    </nav>

    <div class="status">
      <span class="dot"></span> 在线 · 欢迎交流
    </div>

    <footer>© 2026 xu-ovvo · Crafted with GitHub Pages</footer>
  </main>

  <script>
    (function () {
      'use strict';

      /* --- mouse-follow bubbles --- */
      var palette = ['#6366f1', '#22d3ee', '#8b5cf6', '#a5b4fc', '#f472b6', '#34d399'];
      var last = 0;
      function spawnBubble(e) {
        var now = Date.now();
        if (now - last < 90) return;
        last = now;
        var b = document.createElement('span');
        b.className = 'bubble';
        var size = 6 + Math.random() * 10;
        var dx = (Math.random() - 0.5) * 44;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = (e.clientX + (Math.random() - 0.5) * 18) + 'px';
        b.style.top = (e.clientY + (Math.random() - 0.5) * 18) + 'px';
        b.style.setProperty('--dx', dx.toFixed(1) + 'px');
        var color = palette[(Math.random() * palette.length) | 0];
        b.style.background = 'radial-gradient(circle at 35% 32%, rgba(255,255,255,0.9), ' + color + ' 72%)';
        document.body.appendChild(b);
        setTimeout(function () {
          if (b.parentNode) b.parentNode.removeChild(b);
        }, 1150);
      }
      document.addEventListener('mousemove', spawnBubble, { passive: true });

      /* --- drifting particles (lightweight) --- */
      var canvas = document.getElementById('particles');
      var ctx = canvas.getContext('2d');
      var particles = [];
      var count = 0;
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        var target = Math.min(34, Math.floor(canvas.width / 45));
        if (particles.length === 0) {
          count = target;
          for (var i = 0; i < count; i++) particles.push(makeParticle(true));
        }
      }
      function makeParticle(anywhere) {
        return {
          x: Math.random() * canvas.width,
          y: anywhere ? Math.random() * canvas.height : canvas.height + 10,
          r: 0.8 + Math.random() * 2.4,
          vy: -(0.15 + Math.random() * 0.5),
          vx: (Math.random() - 0.5) * 0.22,
          a: 0.15 + Math.random() * 0.5
        };
      }
      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.y < -12 || p.x < -12 || p.x > canvas.width + 12) {
            particles[i] = makeParticle(false);
            continue;
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(180, 200, 255, ' + p.a + ')';
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduced) {
        resize();
        window.addEventListener('resize', resize, { passive: true });
        requestAnimationFrame(tick);
      }
    })();
  </script>
</body>
</html>
